[package]
name = "kollzsh"
version = "0.1.0"
edition = "2021"
description = "AI-powered shell command suggestions for zsh"
license = "MIT"

[[bin]]
name = "kollzsh"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
simplelog = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
